<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>任务配置</title>
  <!-- import CSS -->
  <!--<link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">-->
  <link href="elementUI/index.css" rel="stylesheet" />
  <link href="css/index.css" rel="stylesheet" />
  <style>
    .el-button.el-button--mini {
      margin-left: 0px;
    }

    .el-col-4 {
      width: 220px;
    }

    .el-tabs__item.is-active {
      color: red;
    }

    .el-tabs__active-bar {
      background-color: red;
    }

    .el-menu-item.is-active {
      color: red;
    }

    .el-tabs__content {
      height: 700px;
    }

    .el-table .el-table__cell {
      padding-top: 2px;
      padding-bottom: 2px;
    }

    /* 设置所有行的高度 */
    .el-table .el-table__row {
      height: 40px;
      /* 根据需要设置行高 */
    }

    .el-form-item {
      margin-bottom: 15px;
    }

    .titleBarBtn {
      width: 37px;
      height: 30px;
      color: gray;
      text-align: center;
    }

    .titleBarBtn i {
      font-size: 16px;
      line-height: 30px;
    }

    .titleBarBtn:hover {
      background-color: rgb(232 232 232 / 1);
    }

    .titleBarBtn:active {
      background-color: rgb(222 222 222 / 1);
    }
  </style>

  <!-- import Vue before Element -->
  <!--<script src="https://unpkg.com/vue/dist/vue.js"></script>-->
  <script src="vue/index.min.js"></script>

  <!-- import JavaScript -->
  <!--<script src="https://unpkg.com/element-ui/lib/index.js"></script>-->
  <script src="elementUI/index.js"></script>
</head>

<body>
  <div id="app" style="margin-top: 0px">
    <!-- 页头 -->
    <div class="el-page-header" style="line-height: 30px; background-color: rgb(242 242 242 / 1)" @mousedown="mouseDownForm" @mousemove="mouseMoveForm">
      <div class="el-page-header__content" style="margin-left: 10px; font-size: 15px">
        <img src="img/chromeIco.png" height="19" style="margin-top: 6px; margin-left: 6px; margin-right: 6px; display: block; float: left" />
        <span>私信配置</span>
      </div>
    </div>
    <!-- 右上角按钮 绝对定位加点击穿透 -->
    <div style="position: absolute; right: 0px; top: 0px; pointer-events: auto">
      <!--<el-button type="primary" plain icon="el-icon-refresh" size="mini" @click="clickRefresh"></el-button>-->
      <!--<el-button type="primary" plain icon="el-icon-minus" size="mini" @click="clickMin"></el-button>-->
      <div class="titleBarBtn div-inline" @click="clickMin">
        <i class="el-icon-minus"></i>
      </div>
      <!-- <div class="titleBarBtn div-inline" @click="clickMax">
                      <i :class="windowState==0?'el-icon-full-screen':'el-icon-copy-document'"></i>
                    </div> -->
      <div class="titleBarBtn div-inline" @click="clickClose">
        <i class="el-icon-close"></i>
      </div>
    </div>

    <!-- 表单 -->
    <div style="margin-top: 15px; margin-left: 15px; margin-right: 15px">
      <el-steps :active="step">
        <el-step title="步骤 1" description="配置基本参数"></el-step>
        <el-step title="步骤 2" description="配置达人来源"></el-step>
      </el-steps>

      <div v-show="step==1">
        <el-alert style="margin-top: 10px; margin-bottom: 20px" type="warning" title="创建私信任务 请在此页面配置发送内容 然后点击下一步在店铺“查找达人”页配置筛选达人条件 再点击立即执行" show-icon></el-alert>
        <el-form ref="form" v-loading="loadingForm" :model="form" :rules="rules">
          <el-row :gutter="addgutterSize">
            <el-col :xs="addxsSize" :sm="addsmSize" :md="addmdSize" :lg="addlgSize" :xl="addxlSize">
              <el-form-item label="店铺地区：" prop="regionName" :label-width="lblWidth">
                <el-tag type="danger">{{form.regionName}}</el-tag>
              </el-form-item>
            </el-col>
            <el-col :xs="addxsSize" :sm="addsmSize" :md="addmdSize" :lg="addlgSize" :xl="addxlSize">
              <el-form-item label="店铺名称：" prop="shopName" :label-width="lblWidth">
                <el-tag type="info">{{form.shopName}}</el-tag>
              </el-form-item>
            </el-col>
          </el-row>
          <el-row :gutter="addgutterSize">
            <el-col :xs="10" :sm="10" :md="10" :lg="10" :xl="10">
              <el-form-item label="模板名称：" prop="name" :label-width="lblWidth">
                <el-input v-model="form.name"></el-input>
              </el-form-item>
            </el-col>
            <el-col :xs="2" :sm="2" :md="2" :lg="2" :xl="2">
              <el-checkbox style="margin-left: 10px; margin-top: 10px" v-model="form.save" title="保存可下次再用此配置 有相同名称模板则覆盖">保存为模板</el-checkbox>
            </el-col>
            <el-col :xs="12" :sm="12" :md="12" :lg="12" :xl="12">
              <el-form-item label="切换模板：" prop="selectTemplateId" :label-width="lblWidth">
                <el-select v-model="selectTemplateId" placeholder="请选择模板" @change="changeTemplate" style="width: 367px">
                  <el-option v-for="item in templateItems" :key="item.value" :label="item.name" :value="item.value"> </el-option>
                </el-select>
                <el-link type="primary" :underline="false" @click="delTemplate" v-show="!isDefConfig()">删除</el-link>
              </el-form-item>
            </el-col>
          </el-row>
          <el-row :gutter="addgutterSize">
            <el-form-item label="消息内容：" prop="msgItems" :label-width="lblWidth">
              <el-button size="small" type="danger" @click="addMsgItem()">新增消息</el-button>
              <el-table :data="form.msgItems" border style="width: 80%">
                <!-- 信息序号列 -->
                <el-table-column label="序号" width="50">
                  <template #default="scope"> {{ scope.$index + 1 }} </template>
                </el-table-column>
                <!-- 信息类型列 -->
                <el-table-column label="类型" width="120">
                  <template #default="scope">
                    <!-- 下拉选择框，绑定信息类型 -->
                    <el-select v-model="scope.row.type" placeholder="请选择">
                      <el-option label="文字" value="text"></el-option>
                      <el-option label="图片" value="image"></el-option>
                      <el-option label="商品卡" value="product"></el-option>
                    </el-select>
                  </template>
                </el-table-column>
                <!-- 信息内容列 -->
                <el-table-column label="信息内容">
                  <template #default="scope">
                    <!-- 根据信息类型渲染不同组件 -->
                    <div v-if="scope.row.type === 'text'">
                      <!-- 文字类型输入框 -->
                      <el-input v-model="scope.row.content" type="textarea" :rows="2" placeholder="请输入文字内容"></el-input>
                    </div>
                    <div v-if="scope.row.type === 'image'">
                      <!-- 选择图片按钮 -->
                      <el-button size="small" type="primary" @click="openFileDialog(scope.row)">选择图片</el-button>
                      <!-- 显示已选择图片 -->
                      <img v-if="scope.row.imageUrl" :src="scope.row.imageUrl" style="max-width: 64px; max-height: 64px; vertical-align: middle" />
                      <!-- 隐藏的文件输入框，设置 accept 属性筛选图片类型 -->
                      <input type="file" ref="fileInput" style="display: none" accept="image/jpeg,image/png,image/gif" @change="handleFileChange(scope.row, $event)" />
                    </div>
                    <div v-if="scope.row.type === 'product'">
                      <!-- 商品卡类型输入框 -->
                      <el-input v-model="scope.row.content" placeholder="请输入商品ID"></el-input>
                    </div>
                  </template>
                </el-table-column>
                <!-- 操作列 -->
                <el-table-column label="操作" width="200">
                  <template #default="scope">
                    <!-- 重置按钮 -->
                    <el-button size="small" type="text" @click="resetMessage(scope.row)">重置</el-button>
                    <!-- 删除按钮 -->
                    <el-button size="small" type="text" @click="deleteMessage(scope.row)">删除</el-button>
                  </template>
                </el-table-column>
              </el-table>
            </el-form-item>
          </el-row>
          <el-row :gutter="addgutterSize">
            <el-col :xs="addxsSize" :sm="addsmSize" :md="addmdSize" :lg="addlgSize" :xl="addxlSize">
              <el-form-item label="目标人数：" prop="targetNum" :label-width="lblWidth">
                <!-- <el-input v-model="form.targetNum" title="本次运行最多执行达人数"></el-input> -->
                <el-slider v-model="form.targetNum" :min="1" :max="1000" show-input></el-slider>
              </el-form-item>
            </el-col>
            <el-col :xs="addxsSize" :sm="addsmSize" :md="addmdSize" :lg="addlgSize" :xl="addxlSize">
              <el-form-item label="过滤天数：" prop="skipDays" :label-width="lblWidth">
                <el-slider v-model="form.skipDays" show-input title="默认选中0天不过滤"></el-slider>
              </el-form-item>
            </el-col>
            <el-col :xs="addxsSize" :sm="addsmSize" :md="addmdSize" :lg="addlgSize" :xl="addxlSize">
              <el-form-item label="执行速度：" prop="execSpeed" :label-width="lblWidth">
                <el-select v-model="form.execSpeed" placeholder="请选择" title="每个动作间隔秒数 越大越慢">
                  <el-option v-for="item in opIntervaloptions" :key="item.value" :label="item.label" :value="item.value"></el-option>
                </el-select>
              </el-form-item>
            </el-col>
          </el-row>
          <el-row :gutter="addgutterSize">
            <el-form-item label="运行配置：" prop="execConfig" :label-width="lblWidth">
              <el-checkbox :disabled="!showUseTemplate" v-model="form.useOldParam" title="使用模板配置配置好的查找达人筛选条件和邀约配置立即运行 不勾选则重新配置条件" @change="changeUseOldParam">使用上一次配置</el-checkbox>
              <el-checkbox v-model="form.skipChated" title="与达人有私信记录的情况跳过">跳过已沟通</el-checkbox>
              <el-checkbox v-model="form.skipReply" title="达人发来消息未回复的情况跳过">跳过待回复</el-checkbox>
            </el-form-item>
          </el-row>

          <!-- <el-button type="primary">下一步 选择发送的达人</el-button> -->
        </el-form>
      </div>
      <div style="float: right; margin-right: 5px;">
        <!-- 下一步按钮 -->
        <el-button type="primary" @click="onSaveExecuteTask('form')" style="width: 200px">{{nextBtnText}}</el-button>
      </div>
      <div v-show="step==2" style="float: right; margin-top: 0px; padding-top: 12px; padding-right: 10px;">
        <el-radio-group v-model="form.source" @change="onChangeSource">
          <el-radio label="findCreator">查找达人</el-radio>
          <el-radio label="assignCreator">指定达人</el-radio>
          <!-- 达人来源描述 超过长度的显示省略号 -->
          <span style="width:200px; display:inline-block; white-space:nowrap; overflow: hidden; text-overflow:ellipsis;">{{creatorSouceDesc}}</span>
        </el-radio-group>
      </div>

    </div>
  </div>

  <script>
    new Vue({
      el: "#app",
      data: function () {
        return {
          //0默认 1最小 2最大
          windowState: 0,
          //点击拖拽窗口能否移动
          canMoveForm: false,
          // 弹窗输入框label宽度
          lblWidth: "120px",
          // 等待状态
          loading: false,
          loadingForm: false,
          // 表单添加or编辑or查看
          formOp: "任务配置",
          // 显示添加编辑
          dfvAddEdit: true,
          // 添加编辑框响应式数据
          addgutterSize: 0,
          addxsSize: 24,
          addsmSize: 14,
          addmdSize: 12,
          addlgSize: 12,
          addxlSize: 12,

          //操作步骤 1配置基础参数 2等待确定查找达人参数筛选完成 3等待邀约参数配置完成
          step: "1",
          nextBtnText: "下一步",

          selectTemplateId: "", //选择的模板id
          templateItems: [],
          opIntervaloptions: [
            {
              value: 1,
              label: "1秒",
            },
            {
              value: 3,
              label: "3秒",
            },
            {
              value: 5,
              label: "5秒",
            },
            {
              value: 5,
              label: "7秒",
            },
            {
              value: 9,
              label: "9秒",
            },
          ],
          //app配置参数
          appRunParameters: {
            runConfigs: [],
            currConfig: {},
          },
          showUseTemplate: false,
          //表单 对应传入对象.currConfig
          form: {
            id: "xxxxxxxxxx",
            name: "任务模板1",
            save: true,
            source: 'findCreator',         //达人来源
            assignExcelNamePath: null,     //指定达人的文件路径
            execSpeed: 1,
            useOldParam: false,
            msgItems: [],
          },
          // 表单验证
          rules: {
            // invitationName: [{ required: true, message: "请输入邀约名称", trigger: "blur" }],
          },

          messageList: [
            {
              id: 1,
              type: "text",
              content: "hi",
              imageUrl: "",
            },
            {
              id: 2,
              type: "image",
              content: "",
              imageUrl: "D:\\2.jpg",
            },
            {
              id: 3,
              type: "product",
              content: "",
            },
          ],

          //达人来源描述
          creatorSouceDesc: '请在店铺查找达人页面设置筛选条件'

        };
      },
      methods: {
        //接受传入参数
        async updateData(json) {
          var data = JSON.parse(json);
          console.log("更新数据：", data);
          if (data) {
            this.appRunParameters = data;
            this.createTemplateItems(this.appRunParameters);
            if (data.currConfig) {
              this.form = ____rpaName____.copyObject(data.currConfig);
              this.selectTemplateId = this.appRunParameters.currConfig.id;
              //每次进来自动切换到查找达人
              if (this.step == '2') {
                this.onChangeSource('findCreator')
              }
            }
          }
        },
        //保存并执行任务
        async onSaveExecuteTask(formName) {
          console.log("任务配置：", this.form);
          if (this.formOp === "任务配置") {
            // 添加操作
            this.$refs[formName].validate(async (valid) => {
              if (valid) {
                this.appRunParameters.currConfig = this.form;
                var res = JSON.parse(await dialogFormApi.onSaveExecuteTask(JSON.stringify(this.appRunParameters)));
                if (res.ok) {
                  // this.$message({ type: "success", message: "操作成功" })
                  this.clickClose();
                } else {
                  this.$message({ type: "error", message: res.message });
                }
              } else {
                this.$notify.error({
                  title: "错误",
                  message: "请检查输入是否正确！",
                  offset: 100,
                });
                return false;
              }
            });
          }
        },
        //删除模板
        delTemplate() {
          this.appRunParameters.runConfigs = this.appRunParameters.runConfigs.filter((w) => w.id != this.form.id);
          this.createTemplateItems(this.appRunParameters);
          this.changeTemplate(this.appRunParameters.currConfig.id);
          this.selectTemplateId = this.appRunParameters.currConfig.id;
        },
        //生成模板名下拉列表
        createTemplateItems(data) {
          //创建下拉列表 currConfig为当前默认配置
          this.templateItems = [];
          this.templateItems.push({
            name: "新建模板",
            value: data.currConfig.id,
          });
          //runConfigs为以前用过的模板
          for (const item of data.runConfigs) {
            this.templateItems.push({
              name: item.name,
              value: item.id,
            });
          }
        },
        //当前选择的是不是新建模板
        isDefConfig() {
          if (this.appRunParameters.currConfig && this.form) {
            return this.appRunParameters.currConfig.id == this.form.id;
          }
          return true;
        },

        changeTemplate(id) {
          var selectItem = this.appRunParameters.runConfigs.filter((w) => w.id == id)[0];
          if (!selectItem) {
            selectItem = this.appRunParameters.currConfig;
          }
          this.form = ____rpaName____.copyObject(selectItem);
          //历史模板可以选择使用上次配置
          if (!this.isDefConfig()) {
            this.showUseTemplate = true;
            this.form.useOldParam = true;
          } else {
            this.showUseTemplate = false;
            this.form.useOldParam = false;
          }
          console.log("选择模板：", selectItem.name, this.form, this.templateItems);
        },
        changeUseOldParam(selected) {
          if (selected || this.step == "2") {
            this.nextBtnText = "立即执行";
          } else {
            this.nextBtnText = "下一步";
          }
        },

        addMsgItem(row) {
          this.form.msgItems.push({
            type: "text",
            content: "",
            imageUrl: "",
          });
        },
        // 打开文件选择对话框
        openFileDialog(row) {
          this.$refs.fileInput.click();
        },
        // 处理文件选择事件
        handleFileChange(row, event) {
          console.log("选中文件", row);
          const file = event.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
              row.imageUrl = e.target.result;
            };
            reader.readAsDataURL(file);
          }
          // 清空文件输入框，以便下次选择相同文件也能触发 change 事件
          event.target.value = "";
        },
        // 重置信息内容
        resetMessage(row) {
          if (row.type === "text") {
            row.content = "";
          } else if (row.type === "image") {
            row.imageUrl = "";
          } else if (row.type === "product") {
            row.content = "";
          }
        },
        // 删除信息行
        deleteMessage(row) {
          const index = this.form.msgItems.indexOf(row);
          console.log("删除", row, index);
          if (index > -1) {
            this.form.msgItems.splice(index, 1);
          }
        },

        //切换达人来源
        async onChangeSource(val) {
          if (val == 'assignCreator') {
            if (await this.selectFileName()) {
              return
            }
          }
          this.form.source = 'findCreator'              //未选择文件或切回查找达人
          this.form.assignExcelNamePath = null
          this.creatorSouceDesc = `请在店铺查找达人页面设置筛选条件`
        },
        //选择文件
        async selectFileName() {
          try {
            this.form.assignExcelNamePath = null
            this.creatorSouceDesc = `请在店铺查找达人页面设置筛选条件`
            //传入selectFileNameDir则返回文件名 自动剔除路径
            var body = await ____rpaName____.openFileDialog('Excel文件|*.xlsx|Excel(97-2003)文件|*.xls');
            console.info("选择文件：", body);
            if (body) {
              this.form.assignExcelNamePath = body.fullPath
              this.creatorSouceDesc = `使用文件：${body.fileName}`
              return true
            }
          } catch (error) {

          }

          return false
        },
        //获取时间戳
        getTimestamp() {
          return new Date().getTime();
        },

        //以下都是常用方法
        mouseMoveForm(e) {
          if (this.canMoveForm) {
            console.log("鼠标移动");
            // e.stopPropagation();
            dialogFormApi.mouseDownMove();
            this.canMoveForm = false;
          }
        },
        mouseDownForm(e) {
          // console.log("鼠标按下");
          // e.stopPropagation();
          // mainFormCallback.mouseDownMove();
          this.canMoveForm = true;
        },
        reload() {
          dialogFormApi.reload();
        },
        clickRefresh() {
          console.log("点击了刷新");
          //this.windowState = 1;
          dialogFormApi.reload();
        },
        clickMin() {
          console.log("点击了最小化");
          //this.windowState = 1;
          dialogFormApi.windowState(1);
        },
        clickMax() {
          console.log("点击了最大化");
          if (this.windowState == 0) {
            this.windowState = 2;
          } else {
            //el-icon-crop
            this.windowState = 0;
          }
          dialogFormApi.windowState(this.windowState);
        },
        clickClose() {
          console.log("点击了关闭");
          dialogFormApi.windowClose(0);
        },
      },
      mounted: function () {
        window.rpaVue = this;

        const url = new URL(window.location.href);
        const params = new URLSearchParams(url.search);
        // 获取单个参数的值
        var urlStp = params.get("step");
        if (urlStp) {
          this.step = urlStp;
          if (this.step == "2") {
            this.nextBtnText = "立即执行";
          }
          console.log("步骤：", this.step);
        }
      },
    });
  </script>
</body>

</html>
